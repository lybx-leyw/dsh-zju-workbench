# bundle 行 id 生成规则是「包名去掉 dsh- 前缀」（scripts/test-host.mjs:90-93），
# 即 `zw-core-classroom-vault`。本包在规范 §3 的包谱里叫
# `@lybx-leyw/dsh-zju-core-classroom-vault`，仓里约定 bundle id 用短名
# `zw-classroom-vault`，与它提供的服务名 `zwClassroomVault` 对齐。
#
# 不与 `zw-classroom-studio`（host-classroom）/ `zw-classroom`
# （source-classroom）撞 id：本包是**领域层**，只被宿主/页面按服务名消费。
- insert:
    - id: zw-classroom-vault
      name: '@lybx-leyw/dsh-zju-core-classroom-vault'