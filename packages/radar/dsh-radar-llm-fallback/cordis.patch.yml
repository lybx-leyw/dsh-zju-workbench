# 候选骨架的挂载补丁 —— **未评审、未接入 profile**。
#
# 与上游 `dsh-llm-fallbacks@0.6.7` 自带的 `bundle/cordis.patch.yml` 的关系：
#   上游那份只有一行 insert（`id: llm-fallbacks` / `name: dsh-llm-fallbacks`），
#   **没有** `!!js` 表达式，因此结构上与本仓的安全补丁兼容。
#   即便如此，本骨架仍**不直接复用上游那份 patch**，理由有二：
#     1. 本仓规定候选包一律 `dsh-radar-` 前缀、用**本仓 id** 插入，
#        以免日后与上游自己的 profile 条目撞 id；
#     2. 由 `src/index.js` 在运行时显式 `import('dsh-llm-fallbacks')` 并调用上游
#        `apply(ctx)`，上游因此成为**本包的依赖**而不是「并列的另一个 bundle」——
#        这样 profile 里只多一行，回滚只需删这一行。
#
# 上游 patch 顶部的排序约束仍然成立，评审时必须连同本包一起看：
#   > the profile must list the llm-retry bundle BEFORE dsh-llm-fallbacks
#   > （可重试失败先交给 llm-retry，重试耗尽后本插件才介入）
#   本仓 profile `zhiyun-bench` 的 bundles 里 **没有**显式的 `dsh-llm-retry` 行，
#   它来自 `@deepseek-ai/dsh-base`。接入前必须先在宿主侧确认 base 已含 retry，
#   且其 `agent/request-error` 监听先于本包生效（见 README §风险 R-2）。
- insert:
    - id: radar-llm-fallback
      name: dsh-radar-llm-fallback
