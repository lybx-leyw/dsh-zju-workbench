# 候选骨架：**未接入 profile** —— 本 patch 只有一条 insert，
# 把 `xstate@5.33.3` 的状态机能力挂成一个可**单独挂起**的对照条目。
#
# 与 A 类（原生 DSH 插件包）不同，`xstate` 是一个**纯函数库**：没有 `dsh.bundle.patch`、
# 不注册路由、不挂插槽。所以本包**没有** `dsh.bundle.patch`，这条 insert 也**不是必须的** ——
# 真正的接入点是「规划」页「今天还剩多少可用时间」那一层，
# 以及未来番茄钟的宿主侧状态（见 README「接入点」）。
#
# 保留这份 patch 只为：评审时能**单独挂起本包**做对照实验
# （挂上 / 摘掉各跑一遍计时用例，用差分证明「暂停期间时钟不被回溯」）。
# 评审通过后应删除本文件，改为在目标包依赖里锁版引入。
- insert:
    - id: radar-focus-machine
      name: dsh-radar-focus-machine
