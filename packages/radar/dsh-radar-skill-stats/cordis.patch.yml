# dsh-radar-skill-stats 的 bundle 补丁层。
#
# 作用：把上游 `@dsh-external/dsh-skill-stats` 的**服务端入口**挂进组合树，
# 只为了拿到它的 `/skill-stats/api/stats` 计数（本包自己不产生任何路由）。
#
# ⚠ 骨架阶段这一行指向**本包自己的占位入口**（`src/index.js` 里没有 `apply()`，
#    被挂载会直接抛错，而不是静默上线一个空面板）。
#    评审通过后，把 `name` 换成上游入口才是真正的「锁版挂载」。
#
# ⚠ 上游 patch 自带的 `id` 是 `skill-stats`，**不可与前端 `dsh-zhiyun-page-plugins`
#    的既有 id 冲突**；本包用 `radar-` 前缀区分，评审时须确认组合树里 `skill-stats`
#    这个 id 只出现一次（上游若已被别处挂载，本包作废）。
- insert:
    - id: radar-skill-stats
      name: dsh-radar-skill-stats
