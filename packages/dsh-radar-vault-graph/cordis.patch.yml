# 候选骨架的挂载补丁 —— **未评审、未接入 profile**，不得写入
# profiles/zhiyun-bench/package.json 的 dsh.profile.bundles。
#
# B 类骨架：本包不引上游 DSH 插件，只是一个**能力封装层**（把 mdast 解析与图算法
# 接到「笔记」页的反向链接/关系视图上）。挂载后它只 `provide` 一个服务
# `radarVaultGraph`，页面侧是否调用由**评审后**的改造决定（本骨架不改任何现有页面、
# 也不改 dsh-zhiyun-vault 一行代码）。
#
# 与 A 类骨架的差别：这里 `insert` 的是本包自己，`name` 就是 npm 包名；
# 上游都是普通 npm 依赖（remark-parse / unist-util-visit / graphology 等），
# 不进 Loader，因此这里**没有**第二行 insert。
- insert:
    - id: radar-vault-graph
      name: dsh-radar-vault-graph
