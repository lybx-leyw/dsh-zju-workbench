# dsh bundle patch：把「笔记」页插进 profile 的层栈。
#
# 本包现在是**纯页面**：只渲染（正文/列表/反链/PDF 阅读器外壳），
# 通过 `/api/zw-vault-notes` 与 `/zw-vault-pdf/` 两条路由读写。
#
# 存储半边（落盘、路径安全、PDF 字节流、RPC）已搬到
# `@lybx-leyw/dsh-zju-core-vault`（`src/notes-host.js`）—— 一个页面包不该管文件。
# 所以：**本包不再有宿主行为**，`src/index.js` 只剩一个空 `apply()`，
# 它存在的唯一理由是让客户端 bundle 进入启动图谱。
- insert:
    - id: zw-page-notes
      name: '@lybx-leyw/dsh-zju-page-notes'
