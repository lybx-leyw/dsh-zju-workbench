# dsh bundle patch：把「规划」页插进 profile 的层栈。
#
# 本包现在是**纯页面**：只渲染（列表 / 日历 / 日程 / pet 对话）。
# 数据聚合与路由（`/_dsh/zw-planning`）已搬到
# `@lybx-leyw/dsh-zju-core-planning` —— 一个页面包不该同时是服务器。
