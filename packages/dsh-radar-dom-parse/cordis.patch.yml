# 候选骨架的挂载补丁 —— **未评审、未接入 profile**，不得写入
# profiles/zhiyun-bench/package.json 的 dsh.profile.bundles。
#
# B 类骨架：本包不引上游 DSH 插件，只是一个**能力封装层**（把 cheerio 的 HTML 级解析
# 接到「智云课堂」的登录页表单提取与课表页解析上）。挂载后它只 `provide` 一个服务
# `radarDomParse`，页面/数据源侧是否调用由**评审后**的改造决定（本骨架不改任何现有文件）。
#
# 与 A 类骨架的差别：这里 `insert` 的是本包自己，`name` 就是 npm 包名；
# 上游 `cheerio` 是普通 npm 依赖，不进 Loader，因此这里**没有**第二行 insert。
#
# ⚠ 评审注意：本包**建议在服务端（Cordis 宿主进程）使用**，不要在浏览器侧引入。
#    理由见 README「风险 R-2」：CAS 登录页是服务端抓取的，客户端没有这份 HTML。
- insert:
    - id: radar-dom-parse
      name: dsh-radar-dom-parse
