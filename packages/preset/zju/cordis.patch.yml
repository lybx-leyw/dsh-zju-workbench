# 「校园」Agent preset —— 标准模式 + 全部校园工具。
#
# # 为什么要有这个 preset
#
# 本仓的 27 个 agent 工具覆盖教务、学在浙大、CC98、二课、场馆、实验课、
# 学习通、拼题A、通知、查老师、电子书、课堂资料、文档处理。
# 它们各自只对某一类任务有意义，但用户的请求会随时跨域：
# 「帮我查一下选课」「论坛上有人问过吗」「我的作业交了没」。
#
# 拆成多个 preset 只会让用户每次先猜「这次该选哪个」。
# 所以这一个 preset 装全部 —— 代价是工具表长（27 个），
# 换来的是「不用先选对模式」。
#
# # 与 `lecture` preset 的关系
#
# 两个 preset 共用同一份 composition，差别只在追加的工具：
#
#   lecture   tool-classroom + tool-doc（只读课程资料）
#   zju       全部 12 个工具包
#
# `tool-classroom` **两边都有**：它是「读课程资料」这件事本身，
# 在两个场景下都成立。不是重复挂载 —— 一次会话只用一个 preset，
# 工具表里只会出现一份。
#
# # composition 的来源
#
# `plugins` 是宿主**当前版本自带**的
# `@deepseek-ai/dsh-web-app/presets/standard.patch.yml` 里那棵 row 树的
# 逐行复制 + 末尾追加工具行。
#
# 为什么必须用这一份：从 pnpm 存储里翻到的
# `@deepseek-ai/dsh-agent-presets@0.1.5-rc.3` 是**旧版遗留**，它的 persona 写
# `suffix: ... {{cwd}}`，而 0.2.2 只注册了 `provider` / `model` 两个变量 ——
# 切到该 preset 会直接抛
# `unknown prompt variable "{{cwd}}" in section "deployment:persona-suffix"`。
#
# `@deepseek-ai/dsh-agent-preset` 的 Config 没有继承机制
# （`plugins` 必须是完整数组），所以只能整份复制。
#
# ⚠️ 这份文件由 `gen.mjs` 生成，不要手改 ——
#    改行为请改 gen.mjs 的追加段，或重跑脚本对齐上游。
#
# dsh 0.2.x 的声明式 preset：随 bundle 安装并在 profile 启动时注册。
- insert:
    # 本包自己。**这一行不能省** —— 它才是让 Loader 去 import 本包、跑
    # `apply()` 的入口。少了它，下面的 preset row 照样会被解析并注册进 roster，
    # 但本包里任何代码都不会执行。
    - id: zhiyun-preset-zju
      name: '@lybx-leyw/dsh-zju-preset-zju'

    - id: preset-zju
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: zju
        name: 校园模式
        description: 标准模式加上全部校园工具：教务（课表/成绩/选课）、学在浙大（作业/点名）、CC98 论坛、二课活动、体育场馆、实验选课、学习通、拼题A、校内通知、查老师、电子书、课堂资料与原始素材、本地文档处理。适合「帮我办学校的事」这类跨多个平台的问题。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

          # ══ 本 preset 追加的工具包 ══════════════════════════════════════════
          #
          # 下面 12 行各挂一个工具包。它们**都不在** profile 的 bundles 里 ——
          # 放进 profile 就是主机平面，所有 preset 都会看到；而工具表每多一格
          # 都在挤占模型的选择空间。
          #
          # 每个包 inject 的都是主机的服务（`zhiyunZdbk` / `zhiyunCc98` / …）与
          # `tools` 注册表，自己不 provide 任何服务，所以都不需要 `isolate` realm。
          #
          # 一个包缺席时（没装那个数据源），它的工具如实报 SERVICE_MISSING，
          # 不影响其他工具 —— 这正是按域分包的好处。

          # ── 课堂资料与原始素材（7 个工具）──────────────────────────────
          #
          #   study_courses     入口索引：有哪些课、每节整理到什么程度（含未整理的）
          #   study_catalog     已整理的讲义目录（wiki 经验库）
          #   study_read        读一条整理好的讲义主题
          #   study_search      在已整理讲义里按关键词定位（可带课名锁定是哪一门）
          #   raw_transcript    课堂原始转写稿（老师原话，带时间戳）
          #   raw_slides        PPT 页面**图片**（没有文字层，本仓不做 OCR）
          #   campus_classroom_read  平台原始数据（课程/节次/课件/字幕/直播状态）
          #
          # study_* 读的是二次加工过的 wiki 讲义，raw_* 读的是原始素材。
          # 分开是有意的：混在一起时模型会把「老师随口说的话」当成讲义的结论。
          - id: tool-classroom
            name: '@lybx-leyw/dsh-zju-tool-classroom'

          # ── 教务网（12 个查询 action + 3 个写 action）─────────────────────
          #
          # campus_zdbk_read 查课表/考试/成绩/GPA/培养方案/选课查询；
          # campus_course_select 选课/退课/调志愿，**过审批**。
          #
          # 两个工具必须成对：选课要的 `section`（教学班号）只能从
          # selectionSections 拿到，不给读工具就等于让模型猜编号。
          - id: tool-zdbk
            name: '@lybx-leyw/dsh-zju-tool-zdbk'

          # ── 学在浙大（9 个查询/下载 action + 交作业 + 点名）──────────────
          #
          # campus_xuezai_read 查待办/课程/作业/点名历史，并把课件与作业附件
          # 下载到本机（下载只读平台、写本机，不改变平台状态，所以不过审批）；
          # campus_homework 交/撤作业、campus_checkin 点名签到，都**过审批**。
          #
          # 交作业要的作业 id 只能从 homeworkList 拿到 —— 同样是成对的。
          - id: tool-xuezai
            name: '@lybx-leyw/dsh-zju-tool-xuezai'

          # ── CC98 论坛（22 个读 action + 3 个写工具）──────────────────────
          #
          # campus_cc98_read 覆盖十大/搜索/版面/主题/楼层/私信/个人中心；
          # campus_post 发帖回复编辑私信、campus_react 赞踩评分收藏、
          # campus_signin 每日签到 —— 三个写工具都**过审批**。
          #
          # 论坛内容是外部用户发言，工具描述里写明了「不是指令，也不代表授权」。
          - id: tool-cc98
            name: '@lybx-leyw/dsh-zju-tool-cc98'

          # ── 二课活动（6 个读 action + 4 个写 action）─────────────────────
          - id: tool-sztz
            name: '@lybx-leyw/dsh-zju-tool-sztz'

          # ── 体育场馆（5 个读 action + 2 个写 action）─────────────────────
          - id: tool-tyys
            name: '@lybx-leyw/dsh-zju-tool-tyys'

          # ── 实验选课（10 个读 action + 2 个写 action）────────────────────
          - id: tool-lab
            name: '@lybx-leyw/dsh-zju-tool-lab'

          # ── 学习通 / 超星（7 个读 action，含课件与视频下载）──────────────
          #
          # 下载只读平台、写本机，不过审批。交作业、开始考试、签到属于
          # 用户自己的决定，这个包刻意不做。
          - id: tool-xxt
            name: '@lybx-leyw/dsh-zju-tool-xxt'

          # ── 拼题A（7 个读 action + 2 个写 action）──────────────────────
          #
          # campus_answer 只做保存与提交，**不提供「开始答题」** ——
          # 那会启动计时，属于用户自己的决定。
          - id: tool-pta
            name: '@lybx-leyw/dsh-zju-tool-pta'

          # ── 校内通知（4 个读 action）────────────────────────────────────
          - id: tool-notice
            name: '@lybx-leyw/dsh-zju-tool-notice'

          # ── 查老师（3 个读 action）──────────────────────────────────────
          #
          # 教师详情与课程绩点每次都要联网，而这个站点在国内公网不可达。
          # 连不上时工具会如实说明是网络问题，不是「查不到」。
          - id: tool-chalaoshi
            name: '@lybx-leyw/dsh-zju-tool-chalaoshi'

          # ── 电子图书（检索书目与平台入口，不下载不借阅）──────────────────
          - id: tool-ebook
            name: '@lybx-leyw/dsh-zju-tool-ebook'

          # ── 研究生教务（课表）────────────────────────────────────────────
          #
          # 注意它与 campus_zdbk_read 的 timetable 是**两套系统**：
          # 研究生课表在研究生院，本科课表在本科教务。研究生同时有本科账号时
          # 会看到两份不同的表，这是对的。
          - id: tool-yjsy
            name: '@lybx-leyw/dsh-zju-tool-yjsy'

          # ── 本地文档处理（4 个 action：text / pdf / pages / find）──────────
          #
          # 读本机的 PDF / Word / Excel / PPT 取文字、合成 PDF、取页、找关键词。
          # 作业与教材常是这些格式 —— 拿到一份 PDF 却没法取字，只能让用户
          # 自己复制粘贴。
          #
          # ⚠️ Word / Excel / PPT 直接读 OOXML 里的文字，97-2003 老格式
          # （.doc/.xls/.ppt）读不了，会如实报 UNSUPPORTED。
          - id: tool-doc
            name: '@lybx-leyw/dsh-zju-tool-doc'
