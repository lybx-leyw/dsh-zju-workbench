# dsh bundle patch：把 PBL（项目式学习）领域层插进 profile 的层栈。
#
# 与其它领域包一致：bundle 列在 `dsh.profile.bundles` 里不会自动加载，
# 必须在自己的 patch 里 insert（见 `dsh-zhiyun-core-classroom-agent` 的同名说明）。
#
# 本包只消费宿主服务 `zhiyunClassroomStudio`，自己不碰网络、不 new 客户端；
# 上游缺失时 `apply()` 照常返回，`status().state` 显示 `degraded`。
- insert:
    - id: zhiyun-classroom-pbl
      name: dsh-zhiyun-core-classroom-pbl
