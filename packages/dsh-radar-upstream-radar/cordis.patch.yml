# dsh-radar-upstream-radar 的 bundle 补丁层。
#
# 作用：把上游 upstream-radar 的服务端入口挂进 profile 的组合树。
# 本包自身**没有**可挂载的逻辑（src/index.js 为占位），
# 这一行是让上游在被评审通过后**能被锁版挂载**的接线点。
#
# 上游入口是 `upstream-radar/dsh`（见上游 package.json 的 exports 与 dsh.bundle.patch），
# 不是裸包名 —— 上游把 CLI 库与 DSH 插件分成了两个入口，此处必须照抄它的 `/dsh` 子路径。
- insert:
    - id: radar-upstream-radar
      name: upstream-radar/dsh
