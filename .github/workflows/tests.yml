name: tests

# 装一份验证过的 DSH 宿主，跑**除浏览器之外**的全部守卫。
#
# # 为什么先接这一档
#
# 仓库此前没有任何 CI（`.github/` 不存在），PR 上那条「CI passed 0/0」是
# 一个检查都没跑。接 CI 的前提是**基线是绿的**：先接一条注定红的工作流，
# 等于把「没有检查」换成「有检查但永远红」，信息量一样，还训练所有人忽略红色。
#
# 所以范围刻意收在「不装 Playwright」：
#   · **装** DSH 宿主 —— parser / quiz / study / notes / knowledge 有一批用例
#     会经 `tests/fixtures/parser/host.mjs` 或 `@deepseek-ai/cordis` 解析到
#     `.runtime/dsh-<version>`。不装它们会报 `Cannot find module
#     '@deepseek-ai/cordis'`，看起来像代码坏了，其实是环境没装齐（实测：
#     这台机器上不装宿主时 4545 个用例里有 23 个这样失败）。
#   · **不装** Playwright —— 浏览器类用例（docs-scroll-keys、paper-tree-keys…）
#     启动一次要十几秒，进 PR 检查会让每次推送都卡几分钟。它们进不进 PR
#     是另一个决定，见 docs/narrow-touch-ergonomics-round3.md §3。
#
# ⚠️ 已知的验证缺口：「装宿主」这一步**没能在开发机上实跑过** —— 那台机器
#    只有 1.8 GB 内存，`npm install` 中途被 OOM killer 杀掉（EXIT=137，
#    dmesg 里是 `oom-kill ... task=npm`）。命令本身取自 CONTRIBUTING.md §1.2
#    的既定流程（`npm install --prefix .runtime/dsh-<version> @deepseek-ai/dsh@<version>`），
#    GitHub 的 ubuntu runner 内存足够；但「第一次跑会不会绿」仍需看首次 CI 结果。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只跑 Node 24。
        #
        # # 为什么不是两条线都跑
        #
        # `engines` 写的是 `^22.19.0 || >=24.0.0`，本来两条线都该验证。但实测
        # Node 22.19 的测试运行器在这批用例上不稳定：同一套代码、同一个
        # `--test-concurrency=1`，
        #
        #   Node 24:  fail 0 / cancelled 0     （全绿）
        #   Node 22:  fail 0 / cancelled 80    （source 组）
        #
        # 被取消的用例报 `failureType: 'cancelledByParent'` /
        # `Promise resolution is still pending but the event loop has already
        # resolved`，**不计入 fail**。试过再加
        # `--experimental-test-isolation=none`：Node 24 上取消归零，Node 22 上
        # 反而放大到 1160/1446 —— 两条线方向相反，没有一个开关能同时稳住。
        #
        # 与其把 22 那条挂成常红（那等于没有检查），这里先只跑 24，把
        # 「Node 22 的 runner 行为要不要单独收敛」留成显式待办，写进
        # docs/narrow-touch-ergonomics-round3.md §3.3。
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ⚠️ `npm ci` **必须带 `--legacy-peer-deps`**。
      #
      # 本仓的 `@deepseek-ai/cordis` 是各包声明的 **peerDependency**
      # （`packages/source/*/package.json`），不在根依赖里；npm 7+ 的 `ci`
      # 会把「peer 没写进锁文件」当成锁与 package.json 不同步而直接失败：
      #   npm error `npm ci` can only install packages when your package.json
      #   and package-lock.json … are in sync
      #   npm error Missing: @deepseek-ai/cordis@4.1.0 from lock file
      # 这正是本工作流第一次跑就红的原因。
      #
      # 文档里也是这个口径：AGENTS.md §「依赖坏了怎么修」给的就是
      # `npm ci --legacy-peer-deps …`。
      #
      # 另：用 `ci` 不用 `install` —— 后者会重写锁文件、并按旧 glob 把 51 个
      # 工作区包当 extraneous 清掉（AGENTS.md 记了那次事故）。
      - name: install
        run: npm ci --legacy-peer-deps --ignore-scripts

      # 工作区包不由 npm 管，要单独建链接。`--check` 会断言 52 个包都链上。
      - name: link workspaces
        run: node scripts/link-workspace-packages.mjs

      - name: link check
        run: node scripts/link-workspace-packages.mjs --check

      # 样式表的跨包顺序依赖：同特异性撞同一属性时胜负只看挂载顺序。
      # 这条跑得很快，而且它拦的是「单看每个包都对、装到一起才错」那类问题。
      - name: css order
        run: npm run check:css

      # 装一份本仓验证过的 DSH 宿主到 `.runtime/dsh-<version>`。
      #
      # # 为什么这一步不能省
      #
      # 不少用例（parser / quiz / study / notes / knowledge）会经由
      # `tests/fixtures/parser/host.mjs` 或 `@deepseek-ai/cordis` 解析到这份
      # **仓库内临时安装**的宿主。没有它时它们报 `Cannot find module
      # '@deepseek-ai/cordis'` —— 看起来像代码坏了，其实是环境没装齐。
      #
      # 用 `preferredHostVersion` 而不是 `latest`：runtime.lock.json 只验证过
      # 一个版本，装别的等于在 CI 里测另一套插槽名。
      #
      # ⚠️ 这里是 `npm install --prefix`，不是仓库根的 `npm install` ——
      #    后者会重写锁文件（AGENTS.md 记过那次事故）。装到 `.runtime/` 下
      #    与本地开发完全同构。
      - name: install verified host
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('runtime.lock.json','utf8')).preferredHostVersion")
          echo "host version: $version"
          npm install --prefix ".runtime/dsh-$version" "@deepseek-ai/dsh@$version" --no-audit --no-fund

      # 不带浏览器的全部守卫，**按顶层目录分批**跑。
      #
      # # 为什么必须分批
      #
      # 第一次跑时把 324 个文件一次性喂给一个 `node --test`（4685 个用例），
      # 结果是 `pass 4560 / fail 1 / cancelled 83` —— 83 个被**取消**，报的错是
      # `Promise resolution is still pending but the event loop has already
      # resolved`。那不是断言失败，是同一个进程里塞太多相互独立的异步用例之后
      # 事件循环提前收尾。分批（每批一个 tests/<层>）就不会走到那个形状。
      #
      # 排除浏览器用例按源码判定（`import … from 'playwright'`），不维护文件名
      # 清单：清单会漂，而漂掉的表现是 CI 卡在一个用例上直到超时，比干脆失败
      # 更难查。浏览器用例仍可本地跑，进不进 PR 见文档 §3。
      - name: guards
        run: |
          set -euo pipefail
          status=0
          for group in repo scripts deploy core source tool apps client; do
            [ -d "tests/$group" ] || continue
            mapfile -t files < <(grep -rL "from 'playwright'" --include='*.test.mjs' "tests/$group" | sort)
            [ "${#files[@]}" -eq 0 ] && continue
            printf '\n=== %s: %d files ===\n' "$group" "${#files[@]}"
            # `--test-concurrency=1`：文件之间串行。
            #
            # 默认并发 = CPU 核数，runner 上同时铺开很多进程。这批用例里不少是
            # 「起假宿主、挂定时器、等超时」的形态，互相把对方的计时挤掉就会
            # 被**取消**：`failureType: 'cancelledByParent'`，报
            # `Promise resolution is still pending but the event loop has already resolved`。
            # 它们不计入 `fail` —— 只看失败数会以为全绿。
            #
            # ⚠️ 也试过 `--experimental-test-isolation=none`（想让所有文件共享
            #    一个事件循环）。**它在 Node 24 上让取消归零，但在 Node 22 上
            #    反而把取消数从 80 放大到 1160/1446** —— 所以这里**不要**加。
            #    记下来是因为那个结论很反直觉：同一组开关在两条引擎版本线上
            #    方向相反。
            #
            # 现在这条是 Node 22/24 上与 `--test-concurrency=1` 搭配时表现最好的
            # 组合；若取消数再冒出来，先按这里记的两个开关重测，再考虑拆更小组。
            if ! node --test --test-concurrency=1 "${files[@]}"; then status=1; fi
          done
          exit "$status"
